name: CI
on:
  push:
    branches: [main, 'phase-*']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:db
      - name: Build (dummy environment, nothing real)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
          SUPABASE_SERVICE_ROLE_KEY: dummy
          APP_URL: http://localhost:3000
          CRON_SECRET: ci-only-not-a-secret
          PAYFAST_MERCHANT_ID: "10000100"
          PAYFAST_MERCHANT_KEY: 46f0cd694581a
          PAYFAST_PASSPHRASE: x
          PAYFAST_SANDBOX: "true"
      # Fails only on NEW high/critical advisories in runtime dependencies (not in .github/audit-allowlist.json); moderate ones are printed. See README "Dependencies".
      - name: npm audit (runtime dependencies, new high/critical only)
        run: node scripts/audit-check.mjs
